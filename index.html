<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercado">
<title>Mercado — minhas compras</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2b705'/%3E%3Cpath d='M14 18h6l5 22h20l5-15H23' fill='none' stroke='%231a1400' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='48' r='3.5' fill='%231a1400'/%3E%3Ccircle cx='43' cy='48' r='3.5' fill='%231a1400'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e0f11; --card:#17191c; --card2:#212429; --line:#2a2e34;
  --text:#f3f3f1; --muted:#989ea6; --acc:#f2b705; --accInk:#1c1600;
  --ok:#41c98c; --bad:#ff6b6b; --shadow:0 10px 40px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f3ef; --card:#ffffff; --card2:#f0efea; --line:#e4e2db;
    --text:#1b1c1e; --muted:#6c7178; --acc:#e0a800; --accInk:#1c1600; --shadow:0 10px 40px rgba(0,0,0,.15); }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;padding:0 14px calc(env(safe-area-inset-bottom) + 160px)}

/* Topo */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) 4px 12px;background:linear-gradient(var(--bg) 78%,transparent)}
.top h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top p b{color:var(--text);font-weight:600}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

/* Busca e filtros */
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;margin:2px 0 10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;padding:11px 0;font-size:16px;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
.chip b{font-weight:600;color:var(--muted);margin-left:3px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.chip.on b{color:var(--accInk)}

/* Cartões e linhas */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 10px 10px 16px}
.sec-h h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sec-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.dots{border:0;background:transparent;width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:20px;line-height:1}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:58px;cursor:pointer}
.row:active{background:var(--card2)}
.tick{flex:none;width:44px;height:44px;margin:-9px -9px -9px -9px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.tick i{width:24px;height:24px;border-radius:50%;border:2px solid #555b62;display:grid;place-items:center}
.tick.miss i{border-color:var(--acc)}
.tick.miss i::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--acc)}
.tick.cart i{background:var(--acc);border-color:var(--acc)}
.tick.cart i::after{content:"";width:6px;height:11px;border:solid var(--accInk);border-width:0 2.5px 2.5px 0;border-radius:0;background:none;transform:translateY(-1px) rotate(45deg)}
.r-main{flex:1;min-width:0}
.r-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.r-end{flex:none;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.r-end small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.plus{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--acc);font-size:21px;font-weight:500}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--muted);vertical-align:2px;margin-left:6px}
.pill.promo{background:rgba(65,201,140,.15);color:var(--ok)}
.add-row{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:13px 16px;text-align:left;color:var(--acc);font-size:15px}
.add-sec{display:block;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:16px;padding:14px;color:var(--muted);font-size:15px;margin-bottom:14px}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;margin:-4px 4px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;border:2px solid var(--acc)}
.legend i.f{background:var(--acc)}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* Resumo e números */
.hero{padding:18px 16px}
.hero .lbl{color:var(--muted);font-size:13px}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.over>i{background:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-top:8px}
.kv b{color:var(--text);font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stats3>div{padding:12px 14px;border-left:1px solid var(--line)}
.stats3>div:first-child{border-left:0}
.stats3 small{display:block;color:var(--muted);font-size:11.5px}
.stats3 b{font-size:16px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}
.h3{font-size:15px;font-weight:650;padding:14px 16px 6px;margin:0}
.hbar{padding:8px 16px}
.hbar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.hbar .t span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.hbar .bar{height:7px}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pnav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);font-size:20px}
.pnav button:disabled{opacity:.3}
.pnav div{text-align:center}
.pnav b{display:block;font-size:16px;text-transform:capitalize}
.pnav small{color:var(--muted);font-size:12px}
.pdet{padding:4px 16px 14px;border-top:1px dashed var(--line);background:var(--card2)}
.pdet table{width:100%;border-collapse:collapse;font-size:13.5px}
.pdet td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pdet td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.pdet td small{display:block;color:var(--muted);font-size:12px}
.pdet .acts{display:flex;gap:8px;margin-top:12px}

/* Carrinho */
.cartsum{padding:14px 16px}
.cartsum .kv{margin-top:4px}
.cartsum .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cartsum .tot b{font-size:26px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;margin-top:14px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:7;width:calc(100% - 28px);max-width:612px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:16px;padding:13px 16px;background:var(--acc);color:var(--accInk);box-shadow:var(--shadow);font-weight:600}
.cartbar span:last-child{font-variant-numeric:tabular-nums}

/* Navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;position:relative}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}
.tabs .bdg{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--accInk);font-size:11px;font-weight:700;display:grid;place-items:center}

/* Folha (modal) */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.sh-h h3{margin:0;font-size:21px;letter-spacing:-.01em}
.sh-h .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.x{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);font-size:20px;line-height:1;color:var(--muted)}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px}
.in,.fld input,.fld select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.money{position:relative}
.money em{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:17px;pointer-events:none}
.money input{padding-left:42px}
.suf{position:relative}
.suf em{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:0 0 14px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:14.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25);font-weight:600}
.stepper{display:flex;gap:8px}
.stepper button{flex:none;width:50px;border:0;border-radius:12px;background:var(--card2);font-size:24px;color:var(--acc)}
.stepper input{text-align:center}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.qchips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13.5px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;margin-bottom:6px;border-top:1px solid var(--line)}
.sw span{font-size:15px}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{left:23px}
.promo{background:var(--card2);border-radius:14px;padding:12px 12px 2px;margin:0 0 12px}
.promo .fld input,.promo .fld select{background:var(--card)}
.calc{background:var(--card2);border-radius:14px;padding:12px 14px;margin:4px 0 12px}
.calc .kv{margin:0 0 4px}
.calc .tt{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.calc .tt b{font-size:26px;font-variant-numeric:tabular-nums}
.calc .nudge{font-size:13px;color:var(--ok);margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin:0 2px 12px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;background:var(--acc);color:var(--accInk);font-weight:650;font-size:16px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{color:var(--bad)}
.btn.small{flex:none;padding:9px 14px;font-size:14px;border-radius:11px}
.link{display:block;margin:14px auto 0;border:0;background:transparent;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.list-btn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:14px 2px;font-size:16px;text-align:left}
.list-btn small{color:var(--muted)}
.spark{width:100%;height:84px;display:block;margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 140px);transform:translateX(-50%);z-index:30;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:fade .2s;max-width:90vw;text-align:center}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="title">Lista</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<button class="cartbar" id="cartbar" data-act="tab" data-v="cart" hidden></button>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="6.5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17.5" r="1.6"/><path d="M10 6.5h10M10 12h10M10 17.5h10"/></svg>Lista</button>
  <button data-act="tab" data-v="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.3 11h10.4L20.5 8H7"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="16.5" cy="19.5" r="1.4"/></svg>Carrinho<span class="bdg" id="cartBdg" hidden></span></button>
  <button data-act="tab" data-v="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Gastos</button>
  <button data-act="tab" data-v="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.6"/></svg>Preços</button>
</nav>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Utilidades ============ */
const KEY = 'mercado.v1';
const $ = (s, r = document) => r.querySelector(s);
let _c = 0;
const uid = () => Date.now().toString(36) + (_c++).toString(36) + Math.random().toString(36).slice(2, 6);
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = (n, d = 3) => (+n || 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
const num = v => {
  if (v == null) return NaN;
  let s = String(v).trim().replace(/\s|R\$|%/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
};
const inVal = n => (n === '' || n == null || !isFinite(n)) ? '' : String(n).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const pad = n => String(n).padStart(2, '0');
const today = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
const dm = d => { const [y, m, dd] = d.split('-'); return `${dd}/${m}`; };
const dmy = d => { const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const wd = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''); };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const unitLbl = u => u === 'kg' ? '/kg' : '/un';
const qtyTxt = (q, u) => u === 'kg' ? `${fmt(q, 3)} kg` : `${fmt(q, 2)} un`;

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

/* ============ Dados iniciais (sua lista do bloco de notas) ============ */
function seed() {
  const sections = [
    { id: 's-rapido', name: 'Acabam rápido', desc: 'Repor a cada nova compra' },
    { id: 's-demoram', name: 'Demoram mais', desc: 'Repor quando restar 1 ou 2 porções' },
    { id: 's-pessoais', name: 'Itens pessoais', desc: 'Higiene e limpeza' }
  ];
  const mk = (sec, name, unit = 'un', o = {}) => ({ id: uid(), sectionId: sec, name, unit, refPrice: o.p ?? null, note: o.n || '', missing: !!o.m });
  const items = [
    mk('s-rapido', 'Queijo mussarela Carinho', 'un', { m: 1 }),

function fix(d) {
  if (!d || !Array.isArray(d.items) || !Array.isArray(d.sections)) return seed();
  d.cart = d.cart && Array.isArray(d.cart.lines) ? d.cart : { lines: [] };
  d.purchases = Array.isArray(d.purchases) ? d.purchases : [];
  d.settings = Object.assign({ goal: 800, closeDay: 0 }, d.settings || {});
  if (!d.sections.length && d.items.length) d.sections.push({ id: uid(), name: 'Itens', desc: '' });
  const ids = new Set(d.sections.map(s => s.id));
  d.items.forEach(i => { if (!ids.has(i.sectionId)) i.sectionId = d.sections[0].id; if (i.unit !== 'kg') i.unit = 'un'; });
  const itemIds = new Set(d.items.map(i => i.id));
  d.cart.lines = d.cart.lines.filter(l => itemIds.has(l.itemId));
  return d;
}

/* ============ Cálculos ============ */
function calcLine(l) {
  const price = +l.price || 0, qty = +l.qty || 0, p = l.promo || {};
  const base = r2(price * qty);
  let total = base, applied = false;
  if (p.on && +p.value > 0 && +p.min > 0 && qty >= +p.min) {
    total = p.type === 'pct' ? r2(base * (1 - Math.min(+p.value, 100) / 100)) : r2(+p.value * qty);
    applied = true;
  }
  return { base, total, disc: Math.max(0, r2(base - total)), applied };
}
const itemById = id => S.items.find(i => i.id === id);
const secById = id => S.sections.find(s => s.id === id);
const cartLine = id => S.cart.lines.find(l => l.itemId === id);
function cartTotals() {
  let base = 0, total = 0, disc = 0;
  S.cart.lines.forEach(l => { const c = calcLine(l); base += c.base; total += c.total; disc += c.disc; });
  return { base: r2(base), total: r2(total), disc: r2(disc), n: S.cart.lines.length };
}
function sortPurchases() {
  S.purchases.sort((a, b) => (b.date.localeCompare(a.date)) || ((b.ts || 0) - (a.ts || 0)));
}
/* Último preço pago de cada item (preço de etiqueta, antes do desconto) */
function lastMap() {
  const m = new Map();
  for (const p of S.purchases) for (const l of p.lines) if (!m.has(l.itemId)) m.set(l.itemId, { price: l.price, date: p.date, unit: l.unit, promo: l.promo });
  return m;
}

/* Período: mês do calendário ou ciclo da fatura do cartão */
function periodOf(date) {
  let [y, m, d] = date.split('-').map(Number);
  const cd = +S.settings.closeDay || 0;
  if (cd && d > cd) { m++; if (m > 12) { m = 1; y++; } }
  return `${y}-${pad(m)}`;
}
function shiftPeriod(key, n) { const [y, m] = key.split('-').map(Number); const t = new Date(y, m - 1 + n, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; }
function periodLabel(key) {
  const [y, m] = key.split('-').map(Number);
  const cd = +S.settings.closeDay || 0;
  if (!cd) return { t: `${MESES[m - 1]} ${y}`, s: 'Mês do calendário' };
  const pm = m === 1 ? 12 : m - 1;
  return { t: `Fatura de ${MESES[m - 1]} ${y}`, s: `Compras de ${pad(cd + 1)}/${pad(pm)} a ${pad(cd)}/${pad(m)}` };
}
function periodTotal(key) {
  return r2(S.purchases.filter(p => periodOf(p.date) === key).reduce((a, p) => a + p.total, 0));
}
function itemStats(id, key) {
  const hist = [];
  let spent = 0, spentP = 0, qty = 0, disc = 0;
  for (const p of S.purchases) for (const l of p.lines) if (l.itemId === id) {
    hist.push({ date: p.date, store: p.store, price: l.price, qty: l.qty, total: l.total, disc: l.disc, eff: l.qty ? l.total / l.qty : 0, unit: l.unit });
    spent += l.total; qty += l.qty; disc += l.disc;
    if (key && periodOf(p.date) === key) spentP += l.total;
  }
  const effs = hist.map(h => h.eff);
  return {
    hist, spent: r2(spent), spentP: r2(spentP), qty, disc: r2(disc), times: hist.length,
    last: hist[0] || null, avg: qty ? spent / qty : 0,
    min: effs.length ? Math.min(...effs) : 0, max: effs.length ? Math.max(...effs) : 0
  };
}

function rowHtml(it, lm) {
  const l = cartLine(it.id);

  if (l) {
    const c = calcLine(l);

    end = `${brl(c.total)}${c.applied ? `<small class="ok">−${brl(c.disc)}</small>` : ''}`;
  } else {

function renderSpend() {
  const key = ui.period, pl = periodLabel(key), cur = periodOf(today());

  const total = r2(ps.reduce((a, p) => a + p.total, 0)), disc = r2(ps.reduce((a, p) => a + (p.disc || 0), 0));
  const goal = +S.settings.goal || 0, pct = goal ? Math.min(100, total / goal * 100) : 0;
  const bySec = {}, byItem = {};
  ps.forEach(p => p.lines.forEach(l => {
    bySec[l.sectionName] = (bySec[l.sectionName] || 0) + l.total;

  }));
  const bars = (obj, lim) => {
    const arr = Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, lim);

    return arr.map(([k, v]) => `<div class="hbar"><div class="t"><span>${esc(k)}</span><span>${brl(v)}</span></div><div class="bar"><i style="width:${(v / mx * 100).toFixed(1)}%"></i></div></div>`).join('');
  };

  if (ui.psort === 'name') withData.sort((a, b) => a.i.name.localeCompare(b.i.name, 'pt-BR'));
  if (ui.psort === 'var') withData.sort((a, b) => (b.s.max - b.s.min) / (b.s.min || 1) - (a.s.max - a.s.min) / (a.s.min || 1));
  let html = '';

    html += `<section class="card">${withData.map(({ i, s }) => `<div class="row" data-act="istat" data-id="${i.id}">

    html += `<div class="empty"><b>Ainda sem histórico de preços</b>Os preços aparecem aqui depois que você finalizar a primeira compra.</div>`;

  $('#pb').innerHTML = html;
}

    <label class="fld"><span id="b-plbl"></span><div class="money"><em>R$</em><input id="b-price" inputmode="decimal" placeholder="0,00" autocomplete="off"></div></label>
    <div id="b-qw"></div>
    <label class="sw"><span>Desconto por quantidade<small>Ex.: "a partir de 3 un., sai R$ 4,49 cada"</small></span><input type="checkbox" id="b-pon"></label>
    <div class="promo" id="b-promo">
      <div class="grid2">
        <label class="fld"><span id="b-pminl">A partir de</span><div class="suf"><input id="b-pmin" inputmode="decimal"><em id="b-pminu"></em></div></label>
        <label class="fld"><span>Tipo</span><select id="b-ptype"><option value="preco">Novo preço</option><option value="pct">% de desconto</option></select></label>
      </div>
      <label class="fld"><span id="b-pvl"></span><div class="money" id="b-pvw"><em id="b-pve">R$</em><input id="b-pval" inputmode="decimal" placeholder="0,00"></div></label>
    </div>
    <div class="calc" id="b-calc"></div>
    ${lp ? `<p class="hint">Última compra: ${brl(lp.price)}${unitLbl(lp.unit)} em ${dmy(lp.date)}${lp.promo && lp.promo.on ? ' (tinha promoção)' : ''}</p>` : ''}
    ${it.note ? `<p class="hint">Obs.: ${esc(it.note)}</p>` : ''}
    <div class="btns">${ex ? '<button class="btn ghost danger" id="b-rm">Remover</button>' : ''}<button class="btn" id="b-ok">${ex ? 'Atualizar' : 'Pôr no carrinho'}</button></div>
    <button class="link" id="b-edit">Editar item (nome, seção, unidade…)</button>`, ov => {
    const P = $('#b-price', ov), PON = $('#b-pon', ov), PMIN = $('#b-pmin', ov), PT = $('#b-ptype', ov), PV = $('#b-pval', ov);
    P.value = inVal(st.price);
    PON.checked = !!st.promo.on; PMIN.value = inVal(st.promo.min); PT.value = st.promo.type || 'preco'; PV.value = inVal(st.promo.value);

    const readQty = () => num($('#b-qty', ov).value);
    const line = () => ({ price: num(P.value), qty: readQty(), promo: { on: PON.checked, min: num(PMIN.value), type: PT.value, value: num(PV.value) } });

    function drawQty() {
      const kg = st.unit === 'kg';
      $('#b-qw', ov).innerHTML = kg
        ? `<label class="fld"><span>Peso (kg)</span><div class="suf"><input id="b-qty" inputmode="decimal" placeholder="Ex.: 1,250" autocomplete="off"><em>kg</em></div></label>
           <div class="qchips">${[0.25, 0.5, 1, 1.5, 2].map(v => `<button type="button" data-q="${v}">${fmt(v)} kg</button>`).join('')}</div>`
        : `<div class="fld"><span>Quantidade</span><div class="stepper"><button type="button" data-s="-1" aria-label="Menos">−</button><input id="b-qty" inputmode="decimal"><button type="button" data-s="1" aria-label="Mais">+</button></div></div>`;
      $('#b-qty', ov).value = inVal(st.qty);
      $('#b-qty', ov).addEventListener('input', e => { st.qty = e.target.value; update(); });
    }
    function update() {
      const kg = st.unit === 'kg';
      ov.querySelectorAll('#b-unit button').forEach(b => b.classList.toggle('on', b.dataset.u === st.unit));
      $('#b-plbl', ov).textContent = kg ? 'Preço do kg' : 'Preço por unidade';
      $('#b-promo', ov).style.display = PON.checked ? '' : 'none';
      $('#b-pminu', ov).textContent = kg ? 'kg' : 'un';
      const pct = PT.value === 'pct';
      $('#b-pvl', ov).textContent = pct ? 'Desconto (%)' : (kg ? 'Preço do kg com desconto' : 'Preço de cada unidade com desconto');
      $('#b-pve', ov).textContent = pct ? '%' : 'R$';
      PV.placeholder = pct ? '10' : '0,00';
      const L = line();
      const box = $('#b-calc', ov);
      if (!(L.price > 0) || !(L.qty > 0)) {
        box.innerHTML = `<div class="kv"><span>${!(L.price > 0) ? 'Informe o preço' : (kg ? 'Informe o peso' : 'Informe a quantidade')}</span></div><div class="tt"><span>Total</span><b>${brl(0)}</b></div>`;
        return;
      }
      const c = calcLine(L);
      let nudge = '';
      if (L.promo.on && L.promo.min > 0 && L.promo.value > 0 && !c.applied) {
        const falta = r2(L.promo.min - L.qty);
        const alt = calcLine({ ...L, qty: L.promo.min });
        nudge = `<div class="nudge">Faltam ${kg ? fmt(falta, 3) + ' kg' : fmt(falta, 2) + ' un.'} para o desconto · com ${kg ? fmt(L.promo.min) + ' kg' : fmt(L.promo.min) + ' un.'} sairia ${brl(alt.total)} (${brl(alt.total / L.promo.min)}${unitLbl(st.unit)})</div>`;
      }
      box.innerHTML = `<div class="kv"><span>${qtyTxt(L.qty, st.unit)} × ${brl(L.price)}${unitLbl(st.unit)}</span><b class="num">${brl(c.base)}</b></div>
        ${c.applied ? `<div class="kv"><span>Desconto por quantidade</span><b class="num ok">−${brl(c.disc)}</b></div><div class="kv"><span>Sai por</span><b class="num">${brl(c.total / L.qty)}${unitLbl(st.unit)}</b></div>` : ''}
        <div class="tt"><span>Total</span><b>${brl(c.total)}</b></div>${nudge}`;
    }
    drawQty(); update();

    $('#b-unit', ov).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.dataset.u === st.unit) return;
      st.unit = b.dataset.u; st.qty = st.unit === 'kg' ? '' : 1; drawQty(); update();
    });
    $('#b-qw', ov).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const q = $('#b-qty', ov);
      if (b.dataset.q) q.value = inVal(+b.dataset.q);
      if (b.dataset.s) { const v = Math.max(0, (num(q.value) || 0) + +b.dataset.s); q.value = inVal(v); }
      st.qty = q.value; update();
    });
    [P, PMIN, PV].forEach(i => i.addEventListener('input', update));
    [PON, PT].forEach(i => i.addEventListener('change', update));
    if (ex && $('#b-rm', ov)) $('#b-rm', ov).onclick = () => {
      S.cart.lines = S.cart.lines.filter(l => l.itemId !== id); save(); closeSheet(); render(); toast('Removido do carrinho');
    };
    $('#b-edit', ov).onclick = () => openEdit(id);
    $('#b-ok', ov).onclick = () => {
      const L = line();
      if (!(L.price > 0)) { toast('Informe o preço'); P.focus(); return; }
      if (!(L.qty > 0)) { toast(st.unit === 'kg' ? 'Informe o peso em kg' : 'Informe a quantidade'); $('#b-qty', ov).focus(); return; }
      if (L.promo.on && !(L.promo.min > 0 && L.promo.value > 0)) { toast('Complete os dados do desconto ou desligue-o'); return; }
      if (!L.promo.on) L.promo = { on: false };
      it.unit = st.unit;
      const data = { itemId: id, price: r2(L.price), qty: L.qty, promo: L.promo };
      const i = S.cart.lines.findIndex(l => l.itemId === id);
      if (i >= 0) S.cart.lines[i] = data; else S.cart.lines.push(data);
      save(); closeSheet(); render();
      toast(`${it.name}: ${brl(calcLine(data).total)}`);
    };
    if (!ex) setTimeout(() => (P.value ? $('#b-qty', ov) : P).focus(), 250);
  });
}

/* --- Criar/editar item --- */
function openEdit(id, secId) {
  const it = id ? itemById(id) : { name: '', sectionId: secId || (S.sections[0] && S.sections[0].id), unit: 'un', refPrice: null, note: '', missing: true };
  if (!S.sections.length) { toast('Crie uma seção primeiro'); openSection(null); return; }
  let unit = it.unit;
  openSheet(`${head(id ? 'Editar item' : 'Novo item')}
    <label class="fld"><span>Nome</span><input id="e-name" value="${esc(it.name)}" placeholder="Ex.: Feijão carioca" autocomplete="off"></label>
    <label class="fld"><span>Seção</span><select id="e-sec">${S.sections.map(s => `<option value="${s.id}" ${s.id === it.sectionId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <div class="fld"><span>Como é vendido</span><div class="seg" id="e-unit" style="margin:0"><button data-u="un">Por unidade</button><button data-u="kg">Por kg (frutas, legumes…)</button></div></div>
    <label class="fld"><span>Preço de referência (opcional)</span><div class="money"><em>R$</em><input id="e-ref" inputmode="decimal" value="${esc(inVal(it.refPrice))}" placeholder="0,00"></div></label>
    <label class="fld"><span>Observação (marca, tamanho…)</span><input id="e-note" value="${esc(it.note)}" placeholder="Ex.: Sadia, pacote 1 kg" autocomplete="off"></label>
    <label class="sw"><span>Está faltando em casa</span><input type="checkbox" id="e-miss" ${it.missing ? 'checked' : ''}></label>
    <div class="btns">${id ? '<button class="btn ghost danger" id="e-del">Excluir</button>' : ''}<button class="btn" id="e-ok">${id ? 'Salvar' : 'Adicionar'}</button></div>`, ov => {
    const drawU = () => ov.querySelectorAll('#e-unit button').forEach(b => b.classList.toggle('on', b.dataset.u === unit));
    drawU();
    $('#e-unit', ov).addEventListener('click', e => { const b = e.target.closest('button'); if (b) { unit = b.dataset.u; drawU(); } });
    $('#e-ok', ov).onclick = () => {
      const name = $('#e-name', ov).value.trim();
      if (!name) { toast('Dê um nome ao item'); $('#e-name', ov).focus(); return; }
      const ref = num($('#e-ref', ov).value);
      const data = { name, sectionId: $('#e-sec', ov).value, unit, refPrice: ref > 0 ? r2(ref) : null, note: $('#e-note', ov).value.trim(), missing: $('#e-miss', ov).checked };
      if (id) Object.assign(it, data); else S.items.push({ id: uid(), ...data });
      save(); closeSheet(); render(); toast(id ? 'Item atualizado' : 'Item adicionado');
    };
    if (id) $('#e-del', ov).onclick = () => {
      if (!confirm(`Excluir "${it.name}" da lista? O histórico de compras dele é mantido.`)) return;
      S.items = S.items.filter(x => x.id !== id);
      S.cart.lines = S.cart.lines.filter(l => l.itemId !== id);
      save(); closeSheet(); render(); toast('Item excluído');
    };
    if (!id) setTimeout(() => $('#e-name', ov).focus(), 250);
  });
}

/* --- Seções --- */
function openSection(id) {
  const sec = id ? secById(id) : { name: '', desc: '' };
  const idx = id ? S.sections.indexOf(sec) : -1;
  const n = id ? S.items.filter(i => i.sectionId === id).length : 0;
  openSheet(`${head(id ? 'Editar seção' : 'Nova seção')}
    <label class="fld"><span>Nome</span><input id="s-name" value="${esc(sec.name)}" placeholder="Ex.: Congelados" autocomplete="off"></label>
    <label class="fld"><span>Descrição (opcional)</span><input id="s-desc" value="${esc(sec.desc)}" placeholder="Ex.: repor a cada 15 dias" autocomplete="off"></label>
    ${id ? `<div class="btns" style="margin:0 0 4px"><button class="btn ghost small" id="s-up" ${idx === 0 ? 'disabled' : ''}>↑ Subir</button><button class="btn ghost small" id="s-down" ${idx === S.sections.length - 1 ? 'disabled' : ''}>↓ Descer</button><button class="btn ghost small" id="s-new">＋ Item</button></div>` : ''}
    <div class="btns">${id ? '<button class="btn ghost danger" id="s-del">Excluir</button>' : ''}<button class="btn" id="s-ok">${id ? 'Salvar' : 'Criar seção'}</button></div>`, ov => {
    const commit = () => {
      const name = $('#s-name', ov).value.trim();
      if (!name) { toast('Dê um nome à seção'); return false; }
      if (id) { sec.name = name; sec.desc = $('#s-desc', ov).value.trim(); }
      else S.sections.push({ id: uid(), name, desc: $('#s-desc', ov).value.trim() });
      save(); return true;
    };
    $('#s-ok', ov).onclick = () => { if (commit()) { closeSheet(); render(); } };
    if (id) {
      const move = d => { const j = idx + d; [S.sections[idx], S.sections[j]] = [S.sections[j], S.sections[idx]]; save(); closeSheet(); render(); };
      $('#s-up', ov).onclick = () => move(-1);
      $('#s-down', ov).onclick = () => move(1);
      $('#s-new', ov).onclick = () => openEdit(null, id);
      $('#s-del', ov).onclick = () => {
        if (!confirm(n ? `Excluir a seção "${sec.name}" e os ${n} itens dela? O histórico de compras é mantido.` : `Excluir a seção "${sec.name}"?`)) return;
        const gone = new Set(S.items.filter(i => i.sectionId === id).map(i => i.id));
        S.items = S.items.filter(i => i.sectionId !== id);
        S.cart.lines = S.cart.lines.filter(l => !gone.has(l.itemId));
        S.sections = S.sections.filter(s => s.id !== id);
        save(); closeSheet(); render(); toast('Seção excluída');
      };
    } else setTimeout(() => $('#s-name', ov).focus(), 250);
  });
}

/* --- Histórico de preço de um item --- */
function spark(hist) {
  const pts = hist.slice().reverse().map(h => h.eff);
  if (!pts.length) return '';
  const W = 320, H = 84, P = 8, mn = Math.min(...pts), mx = Math.max(...pts), rg = mx - mn || 1;
  const xy = pts.map((v, i) => [pts.length === 1 ? W / 2 : P + i * (W - 2 * P) / (pts.length - 1), H - P - (v - mn) / rg * (H - 2 * P)]);
  const path = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${xy.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--acc)"/>`).join('')}</svg>`;
}
function openStats(id) {
  const it = itemById(id); if (!it) return;
  const s = itemStats(id, periodOf(today())), u = unitLbl(it.unit);
  openSheet(`${head(it.name, 'Histórico de preço')}
    <div class="card" style="margin-bottom:12px"><div class="stats3"><div><small>Total gasto</small><b>${brl(s.spent)}</b></div><div><small>Comprado</small><b>${s.times}×</b></div><div><small>Qtd. total</small><b>${qtyTxt(s.qty, it.unit)}</b></div></div>
    <div class="stats3"><div><small>Preço médio</small><b>${brl(s.avg)}</b></div><div><small>Mínimo</small><b class="ok">${brl(s.min)}</b></div><div><small>Máximo</small><b>${brl(s.max)}</b></div></div></div>
    ${s.hist.length > 1 ? `<div class="hint" style="margin-bottom:0">Preço efetivo pago${u} ao longo do tempo</div>${spark(s.hist)}` : ''}
    ${s.disc ? `<p class="hint">Economia com descontos neste item: <b class="ok">${brl(s.disc)}</b></p>` : ''}
    <div class="pdet" style="border-radius:14px;border:0;padding-top:6px"><table>${s.hist.map(h => `<tr><td>${dmy(h.date)}${h.store ? ` · ${esc(h.store)}` : ''}<small>${qtyTxt(h.qty, h.unit)} × ${brl(h.price)}${unitLbl(h.unit)}${h.disc ? ` · −${brl(h.disc)}` : ''}</small></td><td>${brl(h.total)}<small>${brl(h.eff)}${unitLbl(h.unit)}</small></td></tr>`).join('')}</table></div>
    <div class="btns"><button class="btn ghost" id="st-buy">Pôr no carrinho</button></div>`, ov => {
    $('#st-buy', ov).onclick = () => openBuy(id);
  });
}

/* --- Configurações e backup --- */
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function openSettings() {
  const cd = +S.settings.closeDay || 0;
  openSheet(`${head('Configurações')}
    <label class="fld"><span>Meta de gastos por período</span><div class="money"><em>R$</em><input id="c-goal" inputmode="decimal" value="${esc(inVal(S.settings.goal))}" placeholder="Deixe vazio para não usar meta"></div></label>
    <label class="fld"><span>Agrupar gastos por</span><select id="c-close"><option value="0">Mês do calendário (1 a 30/31)</option>
    ${Array.from({ length: 28 }, (_, i) => i + 1).map(d => `<option value="${d}" ${cd === d ? 'selected' : ''}>Fatura do cartão que fecha dia ${d}</option>`).join('')}</select></label>
    <div class="btns" style="margin-bottom:8px"><button class="btn" id="c-ok">Salvar</button></div>
    <button class="list-btn" id="c-json"><span>Fazer backup (JSON)</span><small>exportar ↓</small></button>
    <button class="list-btn" id="c-imp"><span>Restaurar backup</span><small>importar ↑</small></button>
    <button class="list-btn" id="c-csv"><span>Exportar compras para planilha</span><small>CSV ↓</small></button>
    <button class="list-btn" id="c-reset" style="color:var(--bad)"><span>Apagar tudo e recomeçar</span><small>⚠︎</small></button>
    <p class="hint" style="margin-top:12px">Os dados ficam salvos só neste aparelho/navegador. Faça backup de vez em quando.</p>`, ov => {
    $('#c-ok', ov).onclick = () => {
      const g = num($('#c-goal', ov).value);
      S.settings.goal = g > 0 ? r2(g) : 0;
      S.settings.closeDay = +$('#c-close', ov).value;
      ui.period = periodOf(today());
      save(); closeSheet(); render(); toast('Configurações salvas');
    };
    $('#c-json', ov).onclick = () => download(`mercado-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json');
    $('#c-imp', ov).onclick = () => $('#fileIn').click();
    $('#c-csv', ov).onclick = () => {
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const n = v => String(v ?? '').replace('.', ',');
      const rows = [['Data', 'Mercado', 'Item', 'Seção', 'Unidade', 'Quantidade', 'Preço', 'Subtotal', 'Desconto', 'Total'].map(q).join(';')];
      S.purchases.slice().reverse().forEach(p => p.lines.forEach(l => rows.push([dmy(p.date), p.store, l.name, l.sectionName, l.unit, n(l.qty), n(l.price), n(l.base), n(l.disc), n(l.total)].map(q).join(';'))));
      download(`mercado-compras-${today()}.csv`, '﻿' + rows.join('\n'), 'text/csv;charset=utf-8');
    };
    $('#c-reset', ov).onclick = () => {
      if (!confirm('Apagar todas as compras, preços e itens e voltar à lista inicial? Isso não pode ser desfeito.')) return;
      S = seed(); save(); closeSheet(); ui.period = periodOf(today()); render(); toast('Tudo recomeçado');
    };
  });
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.items) || !Array.isArray(d.sections)) throw 0;
      if (!confirm(`Restaurar backup com ${d.items.length} itens e ${(d.purchases || []).length} compras? Os dados atuais serão substituídos.`)) return;
      S = fix(d); sortPurchases(); save(); closeSheet(); render(); toast('Backup restaurado');
    } catch (err) { toast('Arquivo de backup inválido'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ============ Eventos ============ */
document.addEventListener('click', e => {
  if (e.target.closest('.ov')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const { act, id, v } = el.dataset;
  switch (act) {
    case 'tab': ui.tab = v; closeSheet(); render(); scrollTo(0, 0); break;
    case 'miss': { const it = itemById(id); it.missing = !it.missing; save(); render(); break; }
    case 'buy': openBuy(id); break;
    case 'new': openEdit(null, el.dataset.sec); break;
    case 'sec': openSection(id); break;
    case 'newsec': openSection(null); break;
    case 'filter': ui.filter = v; render(); break;
    case 'clearcart': if (confirm('Esvaziar o carrinho?')) { S.cart.lines = []; save(); render(); } break;
    case 'finish': openFinish(); break;
    case 'pnav': ui.period = shiftPeriod(ui.period, +v); ui.open = null; render(); break;
    case 'pur': ui.open = ui.open === id ? null : id; render(); break;
    case 'editpur': openEditPurchase(id); break;
    case 'delpur': if (confirm('Excluir esta compra do histórico?')) { S.purchases = S.purchases.filter(p => p.id !== id); save(); render(); toast('Compra excluída'); } break;
    case 'istat': openStats(id); break;
    case 'psort': ui.psort = v; render(); break;
    case 'settings': openSettings(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('storage', e => { if (e.key === KEY) { try { S = fix(JSON.parse(e.newValue)); render(); } catch (x) {} } });

sortPurchases();
render();
</script>
</body>
</html>
